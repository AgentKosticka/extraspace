name: Release

# CI calls this only after both Rust checks and Android build/lint succeed.
on:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extraspace-apk
          path: dist

      - name: Verify release inputs
        working-directory: dist
        run: |
          test "$(cat commit.txt)" = "$GITHUB_SHA"
          test -s extraspace.apk
          sha256sum --check extraspace.apk.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            # A newer push may have arrived while this run was building.
            head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo 'A newer main commit exists; leaving publication to its run.'
              exit 0
            fi
            tag=continuous
            title='Latest tested build'
            flags=(--prerelease --latest=false)
          else
            tag=${GITHUB_REF#refs/tags/}
            title="Extraspace $tag"
            flags=(--latest)
          fi
          cat > notes.md <<EOF
          APK built, linted and signature-verified by CI for commit $GITHUB_SHA.
          Companion version: $(cat dist/companion-version).
          Both the Rust and Android jobs passed before publication.

          ## Ubuntu installation

          Clone https://github.com/$GH_REPO, then run:

              ./scripts/install-ubuntu.sh

          This installs dependencies, builds the desktop app and downloads the
          checksum-verified APK. No Android SDK is needed. Open Extraspace from
          the GNOME applications grid. Re-run the installer after updating sources
          to upgrade. See the README for USB debugging setup and other distributions.

          CI run: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$tag" = continuous ]; then
              gh api "repos/$GH_REPO/git/refs/tags/$tag" -X PATCH -f sha="$GITHUB_SHA" -F force=true
            fi
            gh release edit "$tag" --title "$title" --notes-file notes.md "${flags[@]}"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" \
              --notes-file notes.md "${flags[@]}"
          fi
