name: Release

# Only version tags call this, after every Rust/GTK and Android check succeeds.
on:
  workflow_call:

permissions:
  contents: write
  actions: read

concurrency:
  group: versioned-releases
  cancel-in-progress: false

jobs:
  release:
    name: Publish versioned release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require a reviewed main commit
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extraspace-apk
          path: dist

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-release.py dist
