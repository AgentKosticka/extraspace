name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI honest: a warning that would be a review comment should fail here.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # gtk4-rs, libadwaita-rs and gstreamer-rs all bind against system headers,
      # so these are build dependencies, not just runtime ones.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev-bin \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-pipewire \
            libpipewire-0.3-dev libclang-dev desktop-file-utils python3-gi

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action implementation
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Installer and setup checks
        run: |
          bash -n scripts/*.sh
          python3 scripts/tests/test_install.py
          python3 scripts/sync-icon.py --check

      - name: Formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        # The unit tests are deliberately hardware-free: protocol, adaptive
        # control, scaling maths and config all run on a bare runner.
        run: cargo test --workspace --locked

      - name: Build
        if: matrix.toolchain == 'stable'
        run: cargo build --release --locked

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Google's retired "tools" package makes this action's old default fail.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install target SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent APK signing key
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          KEYSTORE_BASE64: ${{ secrets.EXTRASPACE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Set the EXTRASPACE_KEYSTORE_BASE64 repository secret before publishing APKs.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/extraspace.keystore"
          echo "EXTRASPACE_KEYSTORE=$RUNNER_TEMP/extraspace.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease lintRelease --no-daemon

      - name: Verify and stage APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/extraspace.apk
          cp companion-version dist/companion-version
          printf '%s\n' "$GITHUB_SHA" > dist/commit.txt
          (cd dist && sha256sum extraspace.apk > extraspace.apk.sha256)

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/extraspace.keystore"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extraspace-apk
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish tested APK
    needs: [rust, android]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
